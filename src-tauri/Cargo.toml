[package]
name = "kata-marrant"
version = "1.2.1"
description = "Judo kata & gokyo trainer"
authors = ["Antoine"]
license = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "kata-marrant"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
thiserror = "2"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Android-only: the WorkManager-backed background scheduler. Skipped on
# desktop because the plugin's desktop init calls block_on from inside the
# tokio runtime and panics with "Cannot start a runtime from within a
# runtime". Skipped on iOS because the upstream plugin ships no iOS impl
# (Kotlin only) — iOS uses tauri-plugin-notification's native scheduling
# instead, see scheduler::schedule_next_ios.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-schedule-task = { git = "https://github.com/charlesschaefer/tauri-plugin-schedule-task", branch = "main" }

# iOS-only: tauri-plugin-notification's `Schedule::At { date, ... }` field
# is `time::OffsetDateTime` (the `time` crate, not chrono). It's already
# in the lockfile transitively via tauri-plugin-notification — this entry
# just makes it nameable from `scheduler::schedule_next_ios`.
[target.'cfg(target_os = "ios")'.dependencies]
time = "0.3"
