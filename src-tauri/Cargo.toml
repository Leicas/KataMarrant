[package]
name = "kata-marrant"
version = "1.8.0"
description = "Judo kata & gokyo trainer"
authors = ["Antoine"]
license = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "kata-marrant"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
thiserror = "2"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Top-level (rather than target-scoped to mobile) so `time::OffsetDateTime`
# is nameable from `scheduler::schedule_next_mobile` on the macos-latest CI
# runner: when this dep was target-scoped to `cfg(target_os = "ios")` the
# symbol resolution was unreliable. The crate is already in the lockfile
# transitively via tauri-plugin-notification, so adding it at the top level
# costs only a single visible name on non-mobile binaries.
time = { version = "0.3", features = ["std"] }

# Auto-updater: desktop-only. Tauri's updater plugin has no Android/iOS
# implementation — mobile updates ship through Play Store / App Store /
# sideload. Target-gating (rather than runtime cfg!) keeps the crate's
# minisign-verify + http transitive deps off mobile binaries entirely.
# tauri-plugin-process is paired with the updater for app.restart() after
# install on Linux AppImage (Windows/macOS bundlers self-relaunch).
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
