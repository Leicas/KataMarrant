[package]
name = "kata-marrant"
version = "1.2.3"
description = "Judo kata & gokyo trainer"
authors = ["Antoine"]
license = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "kata-marrant"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
thiserror = "2"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Top-level so `time::OffsetDateTime` is nameable from
# scheduler::schedule_next_ios (iOS path passes it to
# tauri-plugin-notification's `Schedule::At { date }`). When this dep
# was target-scoped to cfg(target_os = "ios") the symbol was still
# missing on the macos-latest CI runner — Cargo's resolver is reliable
# only when the crate is in the top-level dep graph. The `time` crate
# is already in the lockfile transitively via tauri-plugin-notification,
# so this adds nothing to non-iOS binary size beyond a single name.
time = { version = "0.3", features = ["std"] }

# Android-only: the WorkManager-backed background scheduler. Skipped on
# desktop because the plugin's desktop init calls block_on from inside the
# tokio runtime and panics with "Cannot start a runtime from within a
# runtime". Skipped on iOS because the upstream plugin ships no iOS impl
# (Kotlin only) — iOS uses tauri-plugin-notification's native scheduling
# instead, see scheduler::schedule_next_ios.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-schedule-task = { git = "https://github.com/charlesschaefer/tauri-plugin-schedule-task", branch = "main" }
