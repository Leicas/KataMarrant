<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="te-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
    @keyframes flick { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .zone { animation: pulse 1.7s ease-in-out infinite; transform-origin: 155px 100px; transform-box: fill-box; }
    .pull { animation: flick 1.1s ease-in-out infinite; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Highlight: hands/arms zone -->
  <circle class="zone" cx="155" cy="100" r="50" fill="url(#zone)"/>

  <!-- Tori -->
  <g stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <circle cx="120" cy="65" r="13"/>
    <path d="M 120 78 L 122 145" fill="none"/>
    <!-- Pulling arms strong -->
    <path d="M 122 95 L 165 80 M 122 95 L 95 115" fill="none" stroke-width="4"/>
    <path d="M 122 145 L 105 195 M 122 145 L 140 195" fill="none"/>
  </g>

  <!-- Uke being pulled forward -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <circle cx="200" cy="80" r="12"/>
    <path d="M 200 92 L 215 145" fill="none"/>
    <path d="M 205 110 L 175 105 M 205 110 L 235 130" fill="none"/>
    <path d="M 215 145 L 215 195 M 215 145 L 240 190" fill="none"/>
  </g>

  <!-- Pull motion lines -->
  <path class="pull" d="M 165 85 L 175 75 M 175 92 L 185 82" stroke="#fde68a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">TE · WAZA</text>
</svg>
