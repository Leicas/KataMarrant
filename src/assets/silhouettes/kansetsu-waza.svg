<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="kansetsu-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes lever { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    .zone { animation: pulse 1.8s ease-in-out infinite; transform-origin: 158px 128px; transform-box: fill-box; }
    .tori { animation: lever 2.4s ease-in-out infinite; transform-origin: 200px 175px; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Mat line -->
  <line x1="20" y1="190" x2="300" y2="190" stroke="#252a3d" stroke-width="2"/>

  <!-- Highlight: the elbow joint under attack -->
  <circle class="zone" cx="158" cy="128" r="30" fill="url(#zone)"/>

  <!-- Uke (grey, supine on the mat, one arm extended upward into the lock) -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <!-- head left -->
    <circle cx="72" cy="178" r="12"/>
    <!-- torso -->
    <path d="M 84 178 L 200 178" fill="none" stroke-width="4"/>
    <!-- extended arm — straight, trapped against tori -->
    <path d="M 118 178 L 158 128 L 180 100" fill="none" stroke-width="4"/>
    <!-- free arm -->
    <path d="M 128 178 L 120 160" fill="none"/>
    <!-- legs -->
    <path d="M 200 178 L 240 172 M 200 178 L 245 186" fill="none" stroke-width="4"/>
  </g>

  <!-- Tori (red, sitting on his back beside uke's head, juji-gatame lever) -->
  <g class="tori" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <!-- head, lying back -->
    <circle cx="255" cy="150" r="13"/>
    <!-- torso lying back, hips close to uke's shoulder -->
    <path d="M 245 158 L 200 175" fill="none" stroke-width="4"/>
    <!-- both hands gripping uke's wrist, pulling to the chest -->
    <path d="M 218 168 L 185 118 L 178 98" fill="none"/>
    <path d="M 226 162 L 190 112" fill="none"/>
    <!-- leg across uke's chest, other leg over the head -->
    <path d="M 200 175 L 150 165 L 130 178" fill="none" stroke-width="4"/>
    <path d="M 200 175 L 130 150 L 92 162" fill="none" stroke-width="4"/>
  </g>

  <!-- Pressure marker at the elbow -->
  <g opacity="0.75">
    <circle cx="158" cy="128" r="4" fill="#fde68a"/>
    <circle cx="158" cy="128" r="9" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">KANSETSU · WAZA</text>
</svg>
