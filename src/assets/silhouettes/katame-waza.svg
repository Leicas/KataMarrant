<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="katame-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes pin   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .zone { animation: pulse 2s ease-in-out infinite; transform-origin: 160px 175px; transform-box: fill-box; }
    .tori { animation: pin 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Mat line -->
  <line x1="20" y1="190" x2="300" y2="190" stroke="#252a3d" stroke-width="2"/>

  <!-- Highlight: pin / control zone -->
  <ellipse class="zone" cx="160" cy="175" rx="100" ry="22" fill="url(#zone)"/>

  <!-- Uke (grey, on his back, supine) -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <!-- head left -->
    <circle cx="65" cy="178" r="12"/>
    <!-- torso -->
    <path d="M 77 178 L 200 178" fill="none" stroke-width="4"/>
    <!-- arms (one pinned upward) -->
    <path d="M 110 178 L 130 158" fill="none"/>
    <path d="M 150 178 L 165 152" fill="none"/>
    <!-- legs -->
    <path d="M 200 178 L 230 175 M 200 178 L 235 188" fill="none"/>
  </g>

  <!-- Tori (red, pinning across uke's chest, kesa-gatame style) -->
  <g class="tori" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <!-- head over uke's chest -->
    <circle cx="160" cy="118" r="13"/>
    <!-- torso angled diagonally — the "kesa" sash -->
    <path d="M 160 131 L 130 162" fill="none" stroke-width="4"/>
    <!-- controlling arm wrapping uke's neck -->
    <path d="M 152 128 L 100 158" fill="none"/>
    <!-- other arm trapping uke's arm -->
    <path d="M 168 128 L 145 152" fill="none"/>
    <!-- bent legs / base -->
    <path d="M 130 162 L 110 178 M 130 162 L 165 178" fill="none" stroke-width="4"/>
  </g>

  <!-- Pressure marker -->
  <g opacity="0.7">
    <circle cx="135" cy="155" r="4" fill="#fde68a"/>
    <circle cx="135" cy="155" r="9" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">KATAME · WAZA</text>
</svg>
