<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="shime-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse   { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes squeeze { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-3px); } }
    .zone { animation: pulse 1.8s ease-in-out infinite; transform-origin: 150px 112px; transform-box: fill-box; }
    .tori { animation: squeeze 2.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Mat line -->
  <line x1="20" y1="190" x2="300" y2="190" stroke="#252a3d" stroke-width="2"/>

  <!-- Highlight: the collar / neck control zone -->
  <circle class="zone" cx="150" cy="112" r="34" fill="url(#zone)"/>

  <!-- Uke (grey, seated, facing left, being strangled from behind) -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <!-- head -->
    <circle cx="150" cy="98" r="13"/>
    <!-- torso (upright, seated) -->
    <path d="M 150 111 L 148 160" fill="none" stroke-width="4"/>
    <!-- arms reaching up to defend the collar -->
    <path d="M 149 128 L 118 112" fill="none"/>
    <path d="M 149 128 L 176 116" fill="none"/>
    <!-- legs stretched forward on the mat -->
    <path d="M 148 160 L 95 186 M 148 160 L 105 190" fill="none" stroke-width="4"/>
  </g>

  <!-- Tori (red, kneeling behind uke, arm wrapped around the neck) -->
  <g class="tori" stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <!-- head, above and behind uke's shoulder -->
    <circle cx="192" cy="78" r="13"/>
    <!-- torso leaning in -->
    <path d="M 190 91 L 196 150" fill="none" stroke-width="4"/>
    <!-- strangling arm across uke's throat -->
    <path d="M 190 100 L 160 106 L 132 104" fill="none" stroke-width="4"/>
    <!-- second arm locking behind uke's head -->
    <path d="M 192 104 L 168 88 L 150 84" fill="none"/>
    <!-- kneeling legs -->
    <path d="M 196 150 L 232 186 M 196 150 L 176 188" fill="none" stroke-width="4"/>
  </g>

  <!-- Pressure marker on the throat -->
  <g opacity="0.75">
    <circle cx="140" cy="106" r="4" fill="#fde68a"/>
    <circle cx="140" cy="106" r="9" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">SHIME · WAZA</text>
</svg>
