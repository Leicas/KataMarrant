<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="koshi-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    .zone { animation: pulse 1.9s ease-in-out infinite; transform-origin: 160px 125px; transform-box: fill-box; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Highlight: hip zone -->
  <ellipse class="zone" cx="160" cy="125" rx="55" ry="35" fill="url(#zone)"/>

  <!-- Tori loading uke onto hip -->
  <g stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <circle cx="135" cy="65" r="13"/>
    <path d="M 135 78 Q 145 105 155 130" fill="none"/>
    <path d="M 145 95 L 170 90 M 145 95 L 120 110" fill="none"/>
    <!-- Bent legs (low stance) -->
    <path d="M 155 130 L 135 185 M 155 130 L 175 185" fill="none" stroke-width="4"/>
  </g>

  <!-- Uke draped over hip -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <circle cx="220" cy="105" r="12"/>
    <path d="M 215 117 Q 195 130 165 132" fill="none"/>
    <path d="M 200 125 L 230 145" fill="none"/>
    <path d="M 220 117 L 245 95" fill="none"/>
  </g>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">KOSHI · WAZA</text>
</svg>
