<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ashi-waza fallback">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1f30"/>
      <stop offset="100%" stop-color="#0f1219"/>
    </radialGradient>
    <radialGradient id="zone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes sweep { 0% { stroke-dashoffset: 60; } 100% { stroke-dashoffset: 0; } }
    .zone { animation: pulse 1.8s ease-in-out infinite; transform-origin: 170px 170px; transform-box: fill-box; }
    .arc  { animation: sweep 1.6s ease-out infinite; }
  </style>
  <rect width="320" height="240" fill="url(#bg)" rx="12"/>

  <!-- Highlight: legs zone -->
  <circle class="zone" cx="170" cy="170" r="55" fill="url(#zone)"/>

  <!-- Tori (red, sweeping) -->
  <g stroke="#ef4444" stroke-width="3" stroke-linecap="round" fill="#ef4444">
    <circle cx="115" cy="70" r="13"/>
    <path d="M 115 83 L 115 138" fill="none"/>
    <path d="M 115 100 L 90 122 M 115 100 L 142 118" fill="none"/>
    <path d="M 115 138 L 105 188 M 115 138 L 165 175" fill="none" stroke-width="4"/>
  </g>

  <!-- Uke (grey, off balance) -->
  <g stroke="#a8aebf" stroke-width="3" stroke-linecap="round" fill="#a8aebf">
    <circle cx="215" cy="80" r="13"/>
    <path d="M 215 93 L 218 148" fill="none"/>
    <path d="M 218 110 L 245 130 M 218 110 L 195 130" fill="none"/>
    <path d="M 218 148 L 208 188 M 218 148 L 235 188" fill="none"/>
  </g>

  <!-- Sweep arc -->
  <path class="arc" d="M 130 175 Q 160 195 200 180" stroke="#fde68a" stroke-width="2" stroke-dasharray="4 3" fill="none" stroke-linecap="round"/>

  <text x="160" y="222" text-anchor="middle" fill="#fde68a" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="3">ASHI · WAZA</text>
</svg>
