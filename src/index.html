<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KataMarrant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="window-shell">
      <!-- Custom titlebar (frameless on desktop). On mobile this whole bar is
           hidden by CSS — the .topbar-mobile below stands in. -->
      <header class="titlebar" data-tauri-drag-region>
        <div class="titlebar-left" data-tauri-drag-region>
          <span class="titlebar-brand" data-tauri-drag-region>KataMarrant</span>
        </div>
        <div class="titlebar-center" data-tauri-drag-region></div>
        <div class="titlebar-right" data-tauri-drag-region>
          <!-- Auto-updater pill mounts here at runtime (between the spacer and
               the window controls). It carries -webkit-app-region: no-drag
               so clicks work inside the drag region. -->
          <div class="window-controls" style="-webkit-app-region: no-drag">
            <button class="wc wc-min"   type="button" aria-label="Minimize" style="-webkit-app-region: no-drag">&#xE921;</button>
            <button class="wc wc-max"   type="button" aria-label="Maximize" style="-webkit-app-region: no-drag">&#xE922;</button>
            <button class="wc wc-close" type="button" aria-label="Close"    style="-webkit-app-region: no-drag">&#xE8BB;</button>
          </div>
        </div>
      </header>

      <div class="shell-body">
        <!-- Sidebar nav (desktop). Collapses to icon-only at 600–959px and
             hides entirely below 600px (bottombar takes over). -->
        <aside class="sidebar" aria-label="Primary">
          <nav class="sidenav">
            <button data-view="home"   class="navitem active" type="button"><span class="ico">●</span><span class="lbl">Home</span></button>
            <button data-view="quiz"   class="navitem"        type="button"><span class="ico">◇</span><span class="lbl">Quiz</span></button>
            <button data-view="rapid"  class="navitem"        type="button"><span class="ico">»</span><span class="lbl">Rapid</span></button>
            <button data-view="drill"  class="navitem"        type="button"><span class="ico">⏱</span><span class="lbl">Drill</span></button>
            <button data-view="nagekomi" class="navitem"      type="button"><span class="ico">↻</span><span class="lbl">Nage-komi</span></button>
            <button data-view="browse" class="navitem"        type="button"><span class="ico">≡</span><span class="lbl">Browse</span></button>
            <button data-view="stats"  class="navitem"        type="button"><span class="ico">▦</span><span class="lbl">Stats</span></button>
          </nav>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-foot">
            <button data-view="settings" class="navitem" type="button"><span class="ico">⚙</span><span class="lbl">Settings</span></button>
          </div>
        </aside>

        <!-- Mobile-only chrome: small topbar with brand + scrollable tab row.
             Hidden on desktop (≥600px) so the titlebar+sidebar combo wins. -->
        <header class="topbar-mobile">
          <h1>KataMarrant</h1>
          <nav class="tabs" aria-label="Primary (mobile)">
            <button data-view="home"     class="tab active" type="button">Home</button>
            <button data-view="quiz"     class="tab"        type="button">Quiz</button>
            <button data-view="rapid"    class="tab"        type="button">Rapid</button>
            <button data-view="drill"    class="tab"        type="button">Drill</button>
            <button data-view="nagekomi" class="tab"        type="button">Nage-komi</button>
            <button data-view="browse"   class="tab"        type="button">Browse</button>
            <button data-view="stats"    class="tab"        type="button">Stats</button>
            <button data-view="settings" class="tab"        type="button">⚙</button>
          </nav>
        </header>

        <main id="view-root">
          <section id="view-home"     class="view active"></section>
          <section id="view-quiz"     class="view"></section>
          <section id="view-rapid"    class="view"></section>
          <section id="view-drill"    class="view"></section>
          <section id="view-nagekomi" class="view"></section>
          <section id="view-browse"   class="view"></section>
          <section id="view-stats"    class="view"></section>
          <section id="view-settings" class="view"></section>
        </main>
      </div>
    </div>

    <!-- Video modal — populated dynamically by main.js when "Watch video" is clicked -->
    <div id="video-modal" class="video-modal hidden" role="dialog" aria-modal="true">
      <div class="video-modal-backdrop"></div>
      <div class="video-modal-frame">
        <button class="video-modal-close" aria-label="Close" type="button">×</button>
        <div class="video-modal-header"></div>
        <div class="video-modal-iframe-wrap"></div>
        <div class="video-modal-footer"></div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
