name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Vanilla JS syntax check
        run: node --check src/main.js

      - name: Verify version files are in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -E '^version *= *"' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"(.+)".*/\1/')
          echo "package.json:      $PKG"
          echo "tauri.conf.json:   $TAURI"
          echo "Cargo.toml:        $CARGO"
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::version mismatch — semantic-release should keep these aligned"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cross-target type checks for the mobile platforms. We don't run a full
  # APK / IPA build here — that needs keystore + Apple Developer signing
  # secrets, neither of which is configured yet. `cargo check` against the
  # cross target catches anything that breaks the cfg(target_os = ...) paths
  # (e.g. tauri-plugin-schedule-task on Android, schedule_next_ios on iOS).
  # ---------------------------------------------------------------------------
  android-check:
    name: Android cargo check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.1.10909125" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-aarch64

      - name: cargo check --target aarch64-linux-android
        working-directory: src-tauri
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: cargo check --target aarch64-linux-android

  ios-check:
    name: iOS cargo check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ios-aarch64

      - name: cargo check --target aarch64-apple-ios
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios
