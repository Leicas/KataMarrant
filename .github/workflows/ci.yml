name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Vanilla JS syntax check
        run: node --check src/main.js

      - name: Verify version files are in sync
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -E '^version *= *"' src-tauri/Cargo.toml | head -1 | sed -E 's/.*"(.+)".*/\1/')
          echo "package.json:      $PKG"
          echo "tauri.conf.json:   $TAURI"
          echo "Cargo.toml:        $CARGO"
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::version mismatch — semantic-release should keep these aligned"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cross-target type checks for the mobile platforms. We don't run a full
  # APK / IPA build here — that needs keystore + Apple Developer signing
  # secrets, neither of which is configured yet. `cargo check` against the
  # cross target catches anything that breaks the cfg(target_os = ...) paths
  # (e.g. tauri-plugin-schedule-task on Android, schedule_next_ios on iOS).
  # ---------------------------------------------------------------------------
  android-check:
    name: Android cargo check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.1.10909125" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-aarch64

      - name: cargo check --target aarch64-linux-android
        working-directory: src-tauri
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          # ring (transitive via reqwest's rustls-tls feature) needs the
          # NDK clang to detect compiler family even for cargo check —
          # otherwise the build script aborts with "failed to find tool
          # aarch64-linux-android-clang". Point cargo at the unified
          # NDK toolchain so cc-rs picks it up.
          NDK_BIN: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo check --target aarch64-linux-android

  ios-build:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ios-build

      - name: cargo check --target aarch64-apple-ios
        working-directory: src-tauri
        run: cargo check --target aarch64-apple-ios

      - run: npm ci

      # `tauri ios init` generates the gen/ios/ Xcode project. Idempotent —
      # safe to re-run on every CI build. We don't check this dir into git
      # so it has to be regenerated each time.
      - name: Generate gen/ios/ Xcode project
        run: npx tauri ios init

      # Simulator build skips signing entirely. Produces a `.app` bundle
      # under target/aarch64-apple-ios-sim/release/bundle/ios that can be
      # opened in Xcode's iOS Simulator on a Mac. No Apple Developer
      # account / cert / provisioning profile required.
      # `tauri ios build --target` uses short names (`aarch64`,
      # `aarch64-sim`, `x86_64`), NOT Rust triples — `aarch64-apple-ios-sim`
      # produces "invalid value" since Tauri's CLI maps the short name to
      # the actual Rust triple internally.
      - name: Build for iPhone Simulator (unsigned)
        run: npx tauri ios build --target aarch64-sim

      # Surface the artefact so reviewers can pull it down for local
      # simulator testing without needing the runner.
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: src-tauri/gen/ios/build/arm64/**/KataMarrant.app
          if-no-files-found: warn
          retention-days: 7
